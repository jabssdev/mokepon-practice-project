<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>MOKEPON!</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&display=swap" rel="stylesheet" />

		<link rel="stylesheet" href="./css/style.css" />
	</head>
	<body>
		<section id="seleccionar-mascota">
			<h1 class="titulo">MOKEPON! 🔥💧🌱</h1>

			<h2 class="subtitulo">Elige tu mascota:</h2>

			<div id="contenedor-tarjetas" class="tarjetas"></div>

			<button id="boton-mascota">Seleccionar</button>
		</section>

		<section id="ver-mapa">
			<h1 class="titulo">Recorre el mapa</h1>
			<canvas id="mapa" width="400" height="300"></canvas>
			<div class="controles-movimiento">
				<button id="boton-mover-arriba" class="boton-de-ataque">Arriba</button>
				<div class="controles-horizontales">
					<button id="boton-mover-izquierda" class="boton-de-ataque">Izquierda</button>
					<button id="boton-mover-derecha" class="boton-de-ataque">Derecha</button>
				</div>
				<button id="boton-mover-abajo" class="boton-de-ataque">Abajo</button>
			</div>
		</section>

		<section id="seleccionar-ataque">
			<h1 class="titulo">MOKEPON! 🔥💧🌱</h1>

			<h2 class="subtitulo">Elige tu ataque:</h2>

			<div id="contenedor-ataques" class="container-botones-ataque"></div>

			<div id="mensajes">
				<p id="resultado">Mucha suerte en la batalla!</p>
				<section id="reiniciar">
					<button id="boton-reiniciar">Reiniciar</button>
				</section>
			</div>

			<div class="ataques">
				<div class="ataques-jugador">
					<p id="vidas-jugador">0</p>
					<p id="mascota-jugador"></p>
					<div id="ataques-del-jugador"></div>
				</div>
				<div class="ataques-enemigo">
					<p id="vidas-enemigo">0</p>
					<p id="mascota-enemigo"></p>
					<div id="ataques-del-enemigo"></div>
				</div>
			</div>
		</section>

		<script src="./js/mokepon.js"></script>
	</body>
</html>
